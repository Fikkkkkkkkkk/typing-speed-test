{% extends "base.html" %}

{% block title %}Sign Up - TypoPulse{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-10">
    <div class="w-full max-w-md glass-panel p-8 rounded-3xl glow-accent transition-all duration-300 relative overflow-hidden">
        <!-- Accent light source inside the card -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-brand-accent opacity-10 blur-2xl rounded-full"></div>
        
        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Create Account</h1>
            <p class="text-brand-textMuted text-sm">Join to track your WPM speed statistics, rank high, and improve</p>
        </div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('register') }}" class="space-y-5 relative z-10">
            <!-- Username -->
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-brand-textMuted mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-brand-textMuted">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" name="username" id="username" required placeholder="Choose a username" minlength="3" maxlength="30"
                        class="w-full bg-[#161626]/60 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm text-white placeholder-brand-textMuted focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all duration-200">
                </div>
            </div>

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-brand-textMuted mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-brand-textMuted">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" name="email" id="email" required placeholder="name@example.com"
                        class="w-full bg-[#161626]/60 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm text-white placeholder-brand-textMuted focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all duration-200">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-brand-textMuted mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-brand-textMuted">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="password" required placeholder="Create a password" minlength="6"
                        class="w-full bg-[#161626]/60 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm text-white placeholder-brand-textMuted focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all duration-200">
                </div>
                <p class="text-[10px] text-brand-textMuted mt-1 ml-1">Must be at least 6 characters long</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full py-3.5 mt-2 rounded-2xl bg-gradient-to-r from-brand-accent to-indigo-600 hover:from-brand-accentLight hover:to-indigo-500 font-semibold text-white transition-all duration-200 shadow-md shadow-brand-accent/25 hover:shadow-brand-accent/40 active:scale-[0.98]">
                Get Started <i class="fa-solid fa-user-plus ml-2 text-xs"></i>
            </button>
        </form>

        <!-- Footer Links -->
        <div class="mt-8 text-center border-t border-white/5 pt-6 relative z-10">
            <p class="text-sm text-brand-textMuted">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="font-semibold text-brand-accentLight hover:text-brand-accent hover:underline transition-colors ml-1">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
